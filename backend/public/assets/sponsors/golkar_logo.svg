<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="50%" stop-color="#F5B400"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="316" height="76" rx="10" fill="#0B0E14" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Pohon Beringin Icon Graphic -->
  <g transform="translate(18, 12)">
    <circle cx="28" cy="28" r="24" fill="url(#goldGrad)" opacity="0.15" />
    <!-- Tree canopy -->
    <path d="M28 8 C20 8 16 16 12 18 C8 20 6 26 10 32 C12 35 15 37 18 38 C18 42 20 46 25 47 L25 50 L31 50 L31 47 C36 46 38 42 38 38 C41 37 44 35 46 32 C50 26 48 20 44 18 C40 16 36 8 28 8 Z" fill="url(#goldGrad)"/>
    <!-- Tree trunk -->
    <rect x="26" y="38" width="4" height="12" fill="#78350F" rx="1"/>
  </g>
  
  <!-- Text -->
  <text x="82" y="34" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="url(#goldGrad)" letter-spacing="2">PARTAI GOLKAR</text>
  <text x="82" y="54" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#E2E8F0" letter-spacing="3">OFFICIAL TOURNAMENT</text>
  <circle cx="295" cy="40" r="4" fill="#10B981" filter="url(#glow)"/>
</svg>
