<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Schedule Control</title>
    <style>
        /* FONT SETUP */
        @font-face {
            font-family: 'Big Noodle Titling';
            src: url('Assets/Font/big_noodle_titling.ttf') format('truetype');
        }

        /* PALET WARNA FUTURISTIK */
        :root {
            --background-color: #0D0F12;
            --card-color: rgba(26, 28, 32, 0.8);
            --font-color: #EAEAEA;
            --font-color-secondary: #a1a1aa;
            --accent-color: #A855F7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --border-color: #3f3f46;
            --blue-side-accent: #00AFFF;
            --red-side-accent: #F94868;
            --active-color: #00FF8C;
            --reset-color: #F94868;
            --blob-color-1: #9333ea;
            --blob-color-2: #27272A;
        }

        /* RESET & PENGATURAN DASAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--background-color); color: var(--font-color); padding: 15px; min-height: 100vh; position: relative; overflow: hidden; }

        /* ANIMASI BLOB BACKGROUND */
        .blob-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; }
        .blob-1 { width: 400px; height: 400px; background-color: var(--blob-color-1); animation: move-blob-1 20s infinite alternate; }
        .blob-2 { width: 300px; height: 300px; background-color: var(--blob-color-2); animation: move-blob-2 25s infinite alternate; }
        @keyframes move-blob-1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(50vw, 40vh) scale(1.2); } }
        @keyframes move-blob-2 { from { transform: translate(80vw, 70vh) scale(1); } to { transform: translate(10vw, 10vh) scale(0.8); } }

        /* STRUKTUR UTAMA */
        .main-container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--card-color); border: 1px solid var(--border-color); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        h1 { font-family: 'Big Noodle Titling', sans-serif; text-align: center; font-size: 2.5em; letter-spacing: 2px; margin-bottom: 20px; color: var(--font-color); text-shadow: 0 0 10px var(--accent-glow); }

        /* TABS */
        .tabs { display: flex; justify-content: center; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; gap: 5px; flex-wrap: wrap; }
        .tab-button { font-family: 'Big Noodle Titling', sans-serif; background: none; border: none; padding: 10px 15px; font-size: 1.1em; letter-spacing: 1px; cursor: pointer; color: var(--font-color-secondary); transition: all 0.3s ease; position: relative; flex-shrink: 0; }
        .tab-button::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 0; height: 3px; background-color: var(--accent-color); transition: width 0.3s ease; }
        .tab-button:hover, .tab-button.active { color: var(--font-color); }
        .tab-button.active::after { width: 100%; }

        /* KONTEN TAB */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .team-container { display: grid; grid-template-columns: 1fr; gap: 20px; margin: 20px 0; }
        .team { padding: 20px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }
        .team:first-child { border-top: 3px solid var(--blue-side-accent); border-left: none; }
        .team:last-child { border-bottom: 3px solid var(--red-side-accent); border-right: none; }
        .team img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; background-color: rgba(0,0,0,0.3); border: 1px dashed var(--border-color); }
        label { font-size: 0.9em; color: var(--font-color-secondary); margin-bottom: 5px; text-align: left; width: 100%; }

        /* INPUTS & BUTTONS */
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--background-color); border: 1px solid var(--border-color); font-size: 1em; color: var(--font-color); transition: all 0.3s ease; }
        input[type="text"]:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; border: 1px solid var(--border-color); background: var(--background-color); padding: 10px; text-align: center; cursor: pointer; margin-bottom: 15px; transition: all 0.3s ease; }
        .file-upload-wrapper:hover { border-color: var(--accent-color); }
        input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .checkbox-container { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .checkbox-container label { width: auto; cursor: pointer; display: flex; align-items: center; font-size: 1.1em; color: var(--font-color); }
        .checkbox-container input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 2px solid var(--border-color); cursor: pointer; margin-right: 10px; transition: all 0.2s ease; position: relative; }
        .checkbox-container input[type="checkbox"]:checked { background-color: var(--active-color); border-color: var(--active-color); }
        .checkbox-container input[type="checkbox"]:checked::after { content: '✔'; position: absolute; color: var(--background-color); font-size: 14px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .schedule-form { text-align: center; }
        button.reset { font-family: 'Big Noodle Titling', sans-serif; background: transparent; color: var(--reset-color); border: 2px solid var(--reset-color); padding: 12px 30px; cursor: pointer; font-size: 1.1em; letter-spacing: 1px; margin-top: 20px; transition: all 0.3s ease; }
        button.reset:hover { background: var(--reset-color); color: var(--background-color); box-shadow: 0 0 15px rgba(249, 72, 104, 0.6); }

        .overlaytoollogo { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .overlaytoollogo img { max-width: 100%; height: auto; }

        @media (min-width: 768px) {
            body { padding: 30px; }
            .main-container { padding: 25px; }
            h1 { font-size: 3em; }
            .tabs { flex-wrap: nowrap; gap: 10px; }
            .tab-button { padding: 12px 24px; font-size: 1.2em; }
            .team-container { grid-template-columns: 1fr 1fr; gap: 25px; }
            .team img { width: 100px; height: 100px; }
            .team:first-child { border-left: 3px solid var(--blue-side-accent); border-top: 1px solid var(--border-color); }
            .team:last-child { border-right: 3px solid var(--red-side-accent); border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="main-container">
        <h1>Schedule Control</h1>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="margin: 0; width: auto; color: var(--font-color);">Layout Display:</label>
                <select id="layout-select" onchange="saveConfig()" style="background: var(--background-color); color: var(--font-color); border: 1px solid var(--border-color); padding: 8px 15px; font-family: 'Big Noodle Titling'; font-size: 1.1em; outline: none; cursor: pointer;">
                    <option value="horizontal">Horizontal (Side by Side)</option>
                    <option value="vertical">Vertical (Stacked)</option>
                </select>
            </div>
            <button class="tab-button" onclick="addSchedule()" style="border: 1px solid var(--active-color); color: var(--active-color);">+ ADD NEW SCHEDULE</button>
        </div>

        <div class="tabs" id="tabs-container"></div>
        <div id="tab-contents"></div>
    </div>

    <div class="overlaytoollogo">
        <img src="Assets/Other/OVERLAYTOOLLOGO.png" alt="">
    </div>
    
<script>
    const DEFAULT_LOGO = 'Assets/Other/transparent.png';
    let globalScheduleData = {}; 
    let currentTabId = 1;

    async function loadSchedules() {
        try {
            const response = await fetch('/api/schedule');
            const data = await response.json();

            // Set Layout Config
            if (data.config && data.config.layout) {
                document.getElementById('layout-select').value = data.config.layout;
            } else {
                data.config = { layout: 'horizontal' };
            }

            globalScheduleData = data;

            // Ensure Minimum 4 Schedules exist in data
            for (let i = 1; i <= 4; i++) {
                if (!globalScheduleData[i.toString()]) {
                    globalScheduleData[i.toString()] = { show: false };
                }
            }

            renderUI();
        } catch (error) {
            console.error('Error loading schedules:', error);
        }
    }

    function renderUI() {
        const tabsContainer = document.getElementById('tabs-container');
        const contentsContainer = document.getElementById('tab-contents');
        tabsContainer.innerHTML = '';
        contentsContainer.innerHTML = '';

        // Dapatkan semua kunci jadwal (buang 'config' dan urutkan secara numerik)
        const keys = Object.keys(globalScheduleData)
            .filter(k => k !== 'config')
            .map(Number)
            .sort((a, b) => a - b);

        keys.forEach(id => {
            // Render Tab Button
            const btn = document.createElement('button');
            btn.className = `tab-button ${id === currentTabId ? 'active' : ''}`;
            btn.innerText = `Schedule ${id}`;
            btn.onclick = () => openTab(id);
            tabsContainer.appendChild(btn);

            // Render Tab Content
            const data = globalScheduleData[id] || {};
            const logo1 = (data.logo1 && data.logo1.length > 50) ? data.logo1 : DEFAULT_LOGO;
            const logo2 = (data.logo2 && data.logo2.length > 50) ? data.logo2 : DEFAULT_LOGO;
            
            const contentHTML = `
            <div id="schedule-${id}" class="tab-content ${id === currentTabId ? 'active' : ''}">
                <div class="schedule-form">
                    <div class="checkbox-container">
                        <label>
                            <input type="checkbox" id="show-${id}" ${data.show ? 'checked' : ''} onchange="saveSchedule(${id})"> Show on Display
                        </label>
                    </div>
                    <div class="team-container">
                        <div class="team">
                            <img id="logo1-${id}" src="${logo1}" alt="Logo 1">
                            <label>Team 1 Logo</label>
                            <div class="file-upload-wrapper">
                                <span>Choose File</span>
                                <input type="file" id="logo1-file-${id}" accept="image/*" onchange="updateLogo(${id}, 1)">
                            </div>
                            <label>Team Name 1</label>
                            <input type="text" id="team1-${id}" value="${data.team1 || ''}" oninput="saveSchedule(${id})" placeholder="Enter Team Name">
                            <label>Score 1</label>
                            <input type="text" id="score1-${id}" value="${data.score1 || ''}" oninput="saveSchedule(${id})" placeholder="Enter Score">
                        </div>
                        <div class="team">
                            <img id="logo2-${id}" src="${logo2}" alt="Logo 2">
                            <label>Team 2 Logo</label>
                            <div class="file-upload-wrapper">
                                 <span>Choose File</span>
                                <input type="file" id="logo2-file-${id}" accept="image/*" onchange="updateLogo(${id}, 2)">
                            </div>
                            <label>Team Name 2</label>
                            <input type="text" id="team2-${id}" value="${data.team2 || ''}" oninput="saveSchedule(${id})" placeholder="Enter Team Name">
                            <label>Score 2</label>
                            <input type="text" id="score2-${id}" value="${data.score2 || ''}" oninput="saveSchedule(${id})" placeholder="Enter Score">
                        </div>
                    </div>
                    <label>Custom Text</label>
                    <input type="text" id="time-${id}" value="${data.time || ''}" oninput="saveSchedule(${id})" placeholder="e.g., Match Time / Status">
                    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                        <button class="reset" onclick="resetSchedule(${id})">Reset Schedule</button>
                        ${id > 4 ? `<button class="reset" style="color: var(--red-side-accent); border-color: var(--red-side-accent);" onclick="deleteSchedule(${id})">Delete Schedule</button>` : ''}
                    </div>
                </div>
            </div>`;
            
            contentsContainer.insertAdjacentHTML('beforeend', contentHTML);
        });
    }

    function openTab(id) {
        currentTabId = id;
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(`schedule-${id}`).classList.add('active');
        
        // Match button text dynamically
        const buttons = document.querySelectorAll('.tab-button');
        buttons.forEach(btn => {
            if(btn.innerText === `Schedule ${id}`) btn.classList.add('active');
        });
    }

    async function sendDataToServer() {
        try {
            await fetch('/api/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalScheduleData)
            });
        } catch (error) {
            console.error('Save failed:', error);
        }
    }

    function saveSchedule(id) {
        if(!globalScheduleData[id]) globalScheduleData[id] = {};
        globalScheduleData[id].show = document.getElementById(`show-${id}`).checked;
        globalScheduleData[id].time = document.getElementById(`time-${id}`).value;
        globalScheduleData[id].logo1 = document.getElementById(`logo1-${id}`).src;
        globalScheduleData[id].team1 = document.getElementById(`team1-${id}`).value;
        globalScheduleData[id].score1 = document.getElementById(`score1-${id}`).value;
        globalScheduleData[id].logo2 = document.getElementById(`logo2-${id}`).src;
        globalScheduleData[id].team2 = document.getElementById(`team2-${id}`).value;
        globalScheduleData[id].score2 = document.getElementById(`score2-${id}`).value;

        sendDataToServer();
    }

    function saveConfig() {
        if (!globalScheduleData.config) globalScheduleData.config = {};
        globalScheduleData.config.layout = document.getElementById('layout-select').value;
        sendDataToServer();
    }

    function updateLogo(scheduleNum, logoNum) {
        const fileInput = document.getElementById(`logo${logoNum}-file-${scheduleNum}`);
        const imgElement = document.getElementById(`logo${logoNum}-${scheduleNum}`);
        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                saveSchedule(scheduleNum);
            };
            reader.readAsDataURL(file);
        }
    }

    function resetSchedule(id) {
        document.getElementById(`show-${id}`).checked = false;
        document.getElementById(`time-${id}`).value = '';
        document.getElementById(`logo1-${id}`).src = DEFAULT_LOGO;
        document.getElementById(`team1-${id}`).value = '';
        document.getElementById(`score1-${id}`).value = '';
        document.getElementById(`logo2-${id}`).src = DEFAULT_LOGO;
        document.getElementById(`team2-${id}`).value = '';
        document.getElementById(`score2-${id}`).value = '';
        saveSchedule(id);
    }

    async function addSchedule() {
        const keys = Object.keys(globalScheduleData).filter(k => k !== 'config').map(Number);
        const nextId = Math.max(...(keys.length > 0 ? keys : [0])) + 1;
        
        globalScheduleData[nextId] = { show: false };
        currentTabId = nextId;
        
        await sendDataToServer();
        renderUI();
    }

    async function deleteSchedule(id) {
        if(confirm(`Are you sure you want to delete Schedule ${id}?`)) {
            delete globalScheduleData[id];
            currentTabId = 1; // Kembali ke tab awal
            await sendDataToServer();
            renderUI();
        }
    }

    window.onload = loadSchedules;
</script>
<script src="crosshost.js"></script>
</body>
</html>
